# Development stack: Django (auto-reload, ASGI via daphne runserver),
# PostgreSQL, Redis (chat channel layer) and Mailpit (catches all email).
name: scarlett

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  web:
    build:
      context: .
      args:
        REQUIREMENTS: dev
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db
      REDIS_HOST: redis
      RUN_MIGRATIONS: "1"
    command: python manage.py runserver 0.0.0.0:8000
    user: root
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - media:/app/media
      - private_media:/app/private_media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  media:
  private_media:
