{% extends "accounts/account_base.html" %}
{% block title %}Log out — Scarlett Embroidery{% endblock %}
{% block account %}
<div class="card card-raised" style="max-width:520px;padding:30px">
  <h1 class="account-title" style="margin-bottom:8px">Log out of your account?</h1>
  <p class="muted" style="font-size:14px;margin-bottom:22px">Your orders and files stay exactly where they are.</p>
  <form method="post" class="row">
    {% csrf_token %}
    <button type="submit" class="btn btn-ink btn-md">Log out</button>
    <a class="btn btn-outline btn-md" href="{% url 'accounts:dashboard' %}">Stay signed in</a>
  </form>
</div>
{% endblock %}
