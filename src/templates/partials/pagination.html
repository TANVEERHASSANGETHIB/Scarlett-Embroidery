{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn btn-outline" href="{% querystring page=page.previous_page_number %}">← Prev</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-outline" href="{% querystring page=page.next_page_number %}">Next →</a>{% endif %}
</nav>
{% endif %}
